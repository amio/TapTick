# =============================================================================
# TapTick — Landing Page
#
# Deploys the landing page when its source files change on main. The release
# workflow also calls this workflow after publishing the new Sparkle appcast.
# =============================================================================

name: Deploy Landing Page

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/build-site.mjs"
      - "Makefile"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_call:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy Landing Page
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preserve Sparkle appcast
        run: |
          git fetch --depth=1 origin gh-pages
          if git show FETCH_HEAD:appcast.xml > "$RUNNER_TEMP/appcast.xml"; then
            cp "$RUNNER_TEMP/appcast.xml" public/appcast.xml
          else
            echo "No existing appcast found"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"
          check-latest: true
          package-manager-cache: false

      - name: Build landing page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make site

      - name: Deploy landing page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/site
